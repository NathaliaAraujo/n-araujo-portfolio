<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Nomad Design — portfólio e vitrine de trabalho." />

    <!-- Open Graph / social preview defaults. Overridden per-route at runtime
         by src/components/Seo.tsx, but crawlers that don't run JS will only
         ever see these static tags — keep them accurate as a fallback. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nomad Design" />
    <meta property="og:title" content="Nomad Design" />
    <meta property="og:description" content="Nomad Design — portfólio e vitrine de trabalho." />
    <meta property="og:url" content="https://nomaddesign.co" />
    <meta property="og:image" content="https://nomaddesign.co/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
